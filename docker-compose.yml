services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speakahouse
      POSTGRES_USER: speakahouse
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-speakahouse}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakahouse"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
